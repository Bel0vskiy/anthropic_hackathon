<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>the room</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="room"></canvas>
    <main id="chat">
      <header id="status" aria-hidden="true">
        <span id="mood-dot"></span>
        <span id="mood-label">…</span>
      </header>
      <div id="orb-anchor" aria-hidden="true"></div>
      <div id="messages"></div>
      <form id="composer">
        <button id="voice-toggle" type="button" aria-label="voice off">🔇</button>
        <button id="mic" type="button" aria-label="record">◉</button>
        <input
          id="input"
          type="text"
          autocomplete="off"
          placeholder="message…"
          disabled
        />
        <button type="submit" id="send" aria-label="send">↵</button>
      </form>
    </main>

    <div id="gate">
      <form id="gate-form" autocomplete="off">
        <h1 id="gate-title">who's here?</h1>
        <input
          id="name-input"
          type="text"
          maxlength="40"
          autocomplete="off"
          spellcheck="false"
          placeholder="your name"
        />
        <p id="gate-color-label">and what light should the room open in?</p>
        <div id="hue-row" role="radiogroup" aria-label="room colour"></div>
        <p id="gate-voice-label">and whose voice answers?</p>
        <div id="voice-row" role="radiogroup" aria-label="room voice"></div>
        <button type="submit" id="gate-enter">enter</button>
      </form>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
